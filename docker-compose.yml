services:
  # FastAPI Application Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servermonitor_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    networks:
      - servermonitor-network
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

networks:
  servermonitor-network:
    driver: bridge